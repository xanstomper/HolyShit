name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python3 -c "import ast; [ast.parse(open(f).read()) for f in ['scripts/holyshit.py','scripts/holyshit-inject.py','scripts/verify_holyshit.py','scripts/holyconverge.py','scripts/holyleadger.py']]; print('syntax OK')"

      - name: Run verification harness
        run: python3 scripts/verify_holyshit.py

      - name: Check holyconverge convergence logic
        run: python3 scripts/test_holyconverge.py

      - name: Smoke-test holyleadger persistence
        run: |
          export HOLYSHIT_SCRIPT_DIR=$(mktemp -d)
          python3 scripts/holyleadger.py add SSRF-METADATA confirmed --score 90 --target smoke.test >/dev/null
          python3 scripts/holyleadger.py add WPA2-PMKID negative --target smoke.test >/dev/null
          python3 scripts/holyleadger.py chain CLOUD-ACCT SSRF-METADATA→IMDS→CREDS:confirmed --target smoke.test >/dev/null
          OUT=$(python3 scripts/holyleadger.py status --target smoke.test)
          echo "$OUT" | grep -q "SSRF-METADATA" || (echo "::error::ledger missing confirmed class"; exit 1)
          echo "$OUT" | grep -q "CLOUD-ACCT" || (echo "::error::ledger missing chain"; exit 1)
          echo "holyleadger persistence: PASS"

      - name: Smoke-test holyshit unified CLI wiring
        run: python3 scripts/test_holyshit_cli.py

      - name: Smoke-test auto-persist (real subprocess → ledger file)
        run: |
          export HOLYSHIT_SCRIPT_DIR=$(mktemp -d)
          export HOLYSHIT_TARGET=persist.test
          # converge against a converge script that returns CONFIRMED (rc 0) — here we
          # prove persistence wiring end-to-end by pointing converge at a stub via env.
          # (holyshit.py has no converge backend in CI, so exercise _persist via a direct
          # import + fake._run is already covered by test_holyshit_cli; this step instead
          # confirms holyleadger writes a file that converge-persist targets.)
          python3 scripts/holyleadger.py add auto-probe confirmed --target persist.test --score 80 >/dev/null
          python3 scripts/holyleadger.py chain auto-probe "AUTO→PROBE:confirmed" --target persist.test --impact "t" >/dev/null
          LEDGER_FILE="$HOLYSHIT_SCRIPT_DIR/holyleadger/persist.test.json"
          [ -f "$LEDGER_FILE" ] || (echo "::error::ledger file not written at $LEDGER_FILE"; exit 1)
          grep -q '"confirmed"' "$LEDGER_FILE" || exit 1
          # plan reads ledger next-state and emits ordered scan commands
          PLAN=$(python3 scripts/holyshit.py plan --target persist.test --top 5)
          echo "$PLAN" | grep -q "HOLYSHIT PLAN" || (echo "::error::plan missing header"; exit 1)
          echo "$PLAN" | grep -q "auto-probe" || (echo "::error::plan missing class from ledger"; exit 1)
          echo "$PLAN" | grep -q "scan" || (echo "::error::plan missing scan command"; exit 1)
          # report renders from the ledger
          REPORT=$(python3 scripts/holyleadger.py report --target persist.test)
          echo "$REPORT" | grep -q "Confirmed Holy Shits" || (echo "::error::report missing confirmed section"; exit 1)
          echo "$REPORT" | grep -q "auto-probe" || (echo "::error::report missing class"; exit 1)
          echo "auto-persist ledger write: PASS"

      - name: Check for leaked secrets
        run: |
          if grep -rniE "sk-[a-z0-9]{20,}|gho_[a-z0-9]{20,}|api[_-]?key.*=.*['\"][a-z0-9]{20,}|bearer [a-z0-9]{20,}" \
            --include="*" . 2>/dev/null | grep -v ".env.example" | grep -v "HOLYSHIT_API_KEY"; then
            echo "::error::Potential secret leaked in repo files"
            exit 1
          else
            echo "No secrets found"
          fi

      - name: Validate README line counts
        run: |
          MANDATE_LINES=$(wc -l < references/mandate.txt)
          MATRIX_CLASSES=$(grep -c "^- " references/vector-matrix.md)
          MATRIX_CATS=$(grep -c "^## " references/vector-matrix.md)
          echo "mandate: ${MANDATE_LINES} lines"
          echo "vector-matrix: ${MATRIX_CLASSES} classes, ${MATRIX_CATS} categories"
          if [ "$MANDATE_LINES" -lt 100 ]; then
            echo "::error::Mandate shrank below 100 lines — check for accidental truncation"
            exit 1
          fi
          if [ "$MATRIX_CLASSES" -lt 100 ]; then
            echo "::error::Vector matrix shrank below 100 classes — check for accidental truncation"
            exit 1
          fi
